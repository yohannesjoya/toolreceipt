[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolreceipt"
version = "0.4.0"
description = "Catch LLM agents claiming actions they never took. Ledger + claim extraction + receipt for LangGraph."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
langgraph = ["langchain-core>=1.0", "langgraph>=1.0"]

[project.urls]
Homepage = "https://github.com/yohannesjoya/toolreceipt"
Repository = "https://github.com/yohannesjoya/toolreceipt"
Changelog = "https://github.com/yohannesjoya/toolreceipt/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "langchain-core>=1.0", "langgraph>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["toolreceipt"]
include = ["toolreceipt/lexicon.json"]

[tool.hatch.build.targets.sdist]
# The tests need the repository's fixtures/ and README, so they stay out of the sdist.
exclude = ["/tests", "/uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["toolreceipt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
