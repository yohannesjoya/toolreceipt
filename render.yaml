services:
  - type: web
    name: toolreceipt-demo
    runtime: python
    plan: free
    buildFilter:
      paths: ["demo/**", "python/**"]
    buildCommand: pip install "./python[langgraph]" fastapi "uvicorn[standard]" "langchain-groq>=1.1" python-dotenv
    startCommand: cd demo && python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        sync: false
