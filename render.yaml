services:
  - type: web
    name: toolreceipt-demo
    runtime: python
    rootDir: demo
    plan: free
    buildCommand: pip install uv && uv pip install --system "../python[langgraph]" fastapi "uvicorn[standard]" "langchain-groq>=1.1" python-dotenv
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: GROQ_API_KEY
        sync: false
